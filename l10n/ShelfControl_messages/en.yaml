factionOwned_generic_1: '"No, doesn''t seem worth the risk", you think to yourself. "Too many eyes."'
factionOwned_generic_2: 'A simple note rests atop the cover: "Private. Do not touch." The handwriting is sharp, confident, and clearly not bluffing.'
factionOwned_generic_3: "An official seal is stamped into the cover. Whatever is inside, it belongs to an organization - and organizations keep records of who touches their things."
factionOwned_generic_4: "The book bears a mark of ownership. Not a person's - something larger. You put it back."
factionOwned_generic_5: "You pick it up, then set it down again. This kind of property tends to have people watching over it."
factionOwned_generic_6: 'A small tag is tied to the spine: "Organizational property. Not for general use."'
factionOwned_generic_7: "This isn't some merchant's stock. The mark on the cover makes clear it belongs to an order - and orders tend to notice missing texts."
factionOwned_generic_8: "The book is not yours, and the people it belongs to are not the forgiving kind."
factionOwned_generic_9: "You recognize the seal pressed into the cover. Reading this without leave would be noticed - and not overlooked."
factionOwned_generic_10: "There is no seller here to negotiate with. This book belongs to an institution, and institutions do not make exceptions for curiosity."
factionOwned_generic_11: 'A worn stamp on the first page reads: "On loan from the order. Return promptly. Do not copy."'
factionOwned_generic_12: "The mark of an order is pressed into the spine. Earn a place among them and perhaps this would be yours to read."
factionOwned_generic_13: "You feel the weight of the seal on the cover - this text is not unclaimed. Someone with authority over it would notice if it were opened uninvited."
factionOwned_generic_14: 'A folded notice is wedged beneath the book: "All texts on these shelves are organizational property and are not to be accessed without authorization."'
factionOwned_generic_15: "Not everything locked is locked with a key. This book is closed by something less visible - and harder to pick."

