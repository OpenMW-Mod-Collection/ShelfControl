npcOwned_racial_orc_3: "The spine is reinforced with a strip of hammered metal, and {npc_name}'s initials are engraved into it. Someone who does that to a book takes ownership seriously."

npcOwned_racial_redguard_1: "Inside the cover, {npc_name}'s name is written alongside a short line in Yoku script. You cannot read it, but the tone is unmistakable - this book is spoken for."
npcOwned_racial_redguard_2: "A narrow ribbon marks the last-read page, stitched at the end with {npc_name}'s initials. The book feels used, important, and very much not abandoned."
npcOwned_racial_redguard_3: "The cover bears scuff marks and a careful repair along the spine - this book has been maintained with intention. {npc_name}'s name inside confirms it. You leave it undisturbed."

