npcOwned_generic_6: "The guar-leather binding is engraved with initials that match {npc_name}'s name. Someone cared enough to have this book personalized and you feel the urge to befriend them."
npcOwned_generic_7: 'A Hlaalu receipt slips from the pages. "Sold to {npc_name}" with a date from months past. The book is meant for private hands, not yours.'

