npcOwned_generic_1: "A bookmark falls from the pages, inscribed with the name: {npc_name}. Perhaps you should return the bookmark and make amends for losing the place they read last."
npcOwned_generic_2: 'The cover bears a personal inscription: "Property of {npc_name}." You sense this book will not give its secrets to strangers.'
npcOwned_generic_3: "Personal notes line the margins in {npc_name}'s handwriting. This is clearly a treasured volume and you should receive the owner's trust before reading."
npcOwned_generic_4: 'Pressed between the pages, you find a dried stoneflower and a ribbon embroidered with the name "{npc_name}". A bookmark from someone who treasures this tome.'
