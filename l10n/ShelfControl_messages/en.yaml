buyable_faction_player_redoran_5: '"I will not have Redoran kin grasping at unpaid pages like some Telvanni scribe''s servant. Pay."'

buyable_faction_player_telvanni_1: "Knowledge is not free. Those who think otherwise are fools."
buyable_faction_player_telvanni_2: "Each page seems to whisper your name, but the thought of being seen stealing keeps you from opening the book."
buyable_faction_player_telvanni_3: "There is wisdom waiting inside, but wisdom has never been free."
buyable_faction_player_telvanni_4: "Even a refined mind should respect the cost of knowledge."
buyable_faction_player_telvanni_5: "Magic cannot open these pages, only mundane coin."
