# ===== Racial =====

npcOwned_racial_altmer_1: "The margins are filled with annotations in a precise, elegant hand - {npc_name}'s work. To read without permission would feel presumptuous, even beneath you."
npcOwned_racial_altmer_2: "The cover is stamped with {npc_name}'s personal seal. An Altmer who cares enough to mark their books cares enough to notice when someone has touched them."
npcOwned_racial_altmer_3: "A bookplate inside the cover reads: 'From the collection of {npc_name}.' The calligraphy alone suggests this is not a volume to be handled without invitation."

npcOwned_racial_argonian_1: "A worn label is fixed to the spine, hand-lettered in careful Imperial script: '{npc_name}.' In this land, an Argonian who owns a book has worked hard to keep it. You set it down."
npcOwned_racial_argonian_2: "Tucked between the pages is a small drawing - marsh reeds and open water - alongside the name {npc_name}. Wherever this book has been, it has meant something to its owner."
npcOwned_racial_argonian_3: "The book is worn at the edges but carefully maintained. {npc_name}'s name is scratched into the inside cover. Things this carefully kept are not for careless hands."

npcOwned_racial_bosmer_1: "A strip of bark is pressed between the pages, scratched with {npc_name}'s name. For a Bosmer to keep a written volume, it must mean something. You leave it closed."
npcOwned_racial_bosmer_2: "The binding is laced with dried vine instead of thread - {npc_name}'s handiwork, you suspect. Touching it without asking feels wrong."
npcOwned_racial_bosmer_3: "A small carved token falls from the pages, marked with {npc_name}'s initials. The book is clearly personal. You put it back where you found it."

npcOwned_racial_breton_1: "A folded receipt slips from the cover - purchased at considerable cost by {npc_name}. An investment, not a casual possession. You leave it alone."
npcOwned_racial_breton_2: "The inside cover bears {npc_name}'s name and a careful index of annotations by page. Whoever this is, they keep their books like ledgers. They would notice if it were opened."
npcOwned_racial_breton_3: "A wax seal in the cover bears {npc_name}'s mark. Bretons tend to be particular about their property. You set it back down."

npcOwned_racial_dunmer_1: "An ancestral inscription runs along the inside cover, ending with {npc_name}'s name. This book is not just property - it is heritage. You have no right to it."
npcOwned_racial_dunmer_2: "The spine is embossed with {npc_name}'s House sigil. In Dunmer custom, to read another's private text without leave is no small offense."
npcOwned_racial_dunmer_3: "A strip of ash-cloth is used as a bookmark, embroidered with {npc_name}'s name in Daedric script. Old habit, old pride. You close the cover."
npcOwned_racial_dunmer_4: "Personal notes crowd the margins in a tight, angular hand. This is clearly {npc_name}'s private study. The ancestors are said to watch - and so might the owner."

npcOwned_racial_imperial_1: "A printed label is affixed inside the front cover: 'Personal property of {npc_name}. Unauthorized reading is a violation of Imperial property statutes.' You take that seriously."
npcOwned_racial_imperial_2: "The book is catalogued with a small index card tucked into the front: {npc_name}'s name, acquisition date, subject. Whoever this is keeps orderly records. They would know if this were disturbed."
npcOwned_racial_imperial_3: "A neat stamp inside the cover reads: '{npc_name} - Personal Library.' Methodical. The kind of person who notices things."

npcOwned_racial_khajiit_1: "A folded note falls from the pages, written in a looping hand: 'This one's book. Return to {npc_name} if lost.' The tone is friendly. The expectation is clear."
npcOwned_racial_khajiit_2: "The cover is wrapped in a scrap of bright cloth, knotted at the spine. {npc_name}'s name is inked on the inside. A well-traveled book, clearly personal. You put it back."
npcOwned_racial_khajiit_3: "Tucked inside the cover is a small portrait sketch - {npc_name}, you assume - drawn in confident strokes. This book has followed its owner a long way. It is not yours to read."

npcOwned_racial_nord_1: "The cover is scratched with {npc_name}'s name, cut deep into the leather like a claim staked rather than written. You get the message."
npcOwned_racial_nord_2: "A simple mark inside the cover - {npc_name}'s name and nothing else. Nords don't annotate. They own. This one is owned."
npcOwned_racial_nord_3: "A dried snowberry is pressed between the pages alongside a scrap bearing {npc_name}'s name. Something kept close, something personal. You leave it."

npcOwned_racial_orc_1: "The book is bound with leather cord, and {npc_name}'s name is stamped into the front in block letters. Practical. Unambiguous. Not yours."
