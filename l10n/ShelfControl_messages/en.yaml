buyable_faction_owner_telvanni_7: "You sense a powerful magic ward as your hand touches the cover. Its owner will remove it upon payment."

buyable_faction_player_hlaalu_1: '"Coin first, read after. Surely one of our own knows better," the Hlaalu merchant says.'
buyable_faction_player_hlaalu_2: "Gold unlocks words, just as it unlocks doors."
buyable_faction_player_hlaalu_3: "The weight of commerce keeps your hands from turning the page."
