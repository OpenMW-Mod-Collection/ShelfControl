factionOwned_specific_hlaalu_1: "This text belongs to House Hlaalu. Information like this is an asset - not something handed out freely."
factionOwned_specific_hlaalu_2: "House Hlaalu keeps its records close. What is written here has value, and value is not given away without something in return."
factionOwned_specific_hlaalu_3: 'A neat seal marks the cover: "Property of House Hlaalu. Unauthorized access is noted."'
factionOwned_specific_hlaalu_4: "You know how House Hlaalu operates - nothing is free, and everything is recorded. This book is no exception."
factionOwned_specific_hlaalu_5: '"House Hlaalu does not leave its texts unguarded," someone nearby says. "Earn your place in the House, and access like this can be arranged."'
factionOwned_specific_hlaalu_6: "The House tracks what it owns carefully. This book is one of those things - and you have not been given clearance to read it."
factionOwned_specific_hlaalu_7: 'A small slip is tucked inside the cover: "Hlaalu property. Access requires authorization."'

factionOwned_specific_redoran_1: "This volume bears the mark of House Redoran. Until you have served the House and earned your standing, it will remain closed to you."
factionOwned_specific_redoran_2: "The House does not share its texts with those who have not yet proved their worth. Service comes before privilege."
factionOwned_specific_redoran_3: 'A stamp on the spine reads: "House Redoran. For members in service only."'
factionOwned_specific_redoran_4: "You recognize the mark on the cover - this belongs to the House. To read it without standing would be a breach of honor."
factionOwned_specific_redoran_5: '"That text is reserved for those who have served the House," a nearby figure says. "Earn your rank, and it will be made available."'
factionOwned_specific_redoran_6: "House Redoran does not withhold knowledge out of spite - it withholds it because some things must be earned. You have not earned this yet."
factionOwned_specific_redoran_7: 'A short inscription on the cover reads: "Redoran property. Distributed by rank."'

factionOwned_specific_telvanni_1: "This text belongs to House Telvanni. What is written here is not for those who lack the standing - or the power - to make use of it."
factionOwned_specific_telvanni_2: "The House does not distribute its knowledge. It is held, studied, and guarded by those who have proved themselves worthy of it. You have not."
factionOwned_specific_telvanni_3: "A warding glyph is pressed into the cover. Telvanni texts are not opened by the uninitiated - at least, not without consequence."
factionOwned_specific_telvanni_4: '"House Telvanni does not lend its texts to those without standing," a robed figure says with some disdain. "Advance your rank, and perhaps that will change."'
factionOwned_specific_telvanni_5: "You feel the pull of the pages, but the House guards its knowledge with more than locks. Without rank, this text is not yours to read."
factionOwned_specific_telvanni_6: 'A label is pressed into the spine: "House Telvanni - restricted to members of standing."'
factionOwned_specific_telvanni_7: "The House does not believe in sharing knowledge freely - that is not the Telvanni way. Rise through the ranks, and what is here may yet be offered to you."

factionOwned_specific_moragTong_1: "The cover bears a mark you recognize - this text belongs to the Morag Tong. It is not for outside eyes."
factionOwned_specific_moragTong_2: "This text is not for you. The Morag Tong keeps its knowledge close, and you do not have the standing to read it."
factionOwned_specific_moragTong_3: "A small seal pressed into the cover makes the message clear - this belongs to the guild. Outsiders do not read what the guild keeps."
factionOwned_specific_moragTong_4: "You think better of opening this. The Morag Tong notices when their property is disturbed - and they have ways of addressing such things."
factionOwned_specific_moragTong_5: '"That is not for you," a quiet voice says nearby. There is no anger in it - only certainty.'
factionOwned_specific_moragTong_6: "The guild keeps its texts for a reason. What is written here is not meant for those who have not earned trust within the order."
factionOwned_specific_moragTong_7: "You set the book down. Whatever is written inside, it belongs to the guild - and the guild does not forgive careless hands."
factionOwned_specific_moragTong_8: 'A folded note slips out from between the pages: "Guild record. Return if found."'

# ===== Archetype =====

factionOwned_archetype_warrior_1: "This book belongs to the order. Until you have earned a place among them, its pages are not yours to read."
factionOwned_archetype_warrior_2: "The spine bears a mark you recognize - this text belongs to the order. It is not lent to those who have not yet proved themselves."
factionOwned_archetype_warrior_3: 'A stamp inside the cover reads: "Property of the Order. Members in good standing only."'
factionOwned_archetype_warrior_4: "You reach for the cover but stop yourself. This volume is not for outsiders. Earn your rank first, and perhaps it will be offered."
factionOwned_archetype_warrior_5: "Access to this text is reserved for those who have served. You have not yet earned that right."
factionOwned_archetype_warrior_6: "There is no shame in being turned away from knowledge you have not yet earned. Prove yourself to the order, and these pages may open to you."
factionOwned_archetype_warrior_7: 'A short note is tucked under the book: "For members only. If you must ask, you are not one."'
factionOwned_archetype_warrior_8: '"That volume is not for outsiders," a nearby guard says flatly. "When you have served, you will be given access."'

factionOwned_archetype_mage_1: "This text is restricted to authorized members. The order does not share its knowledge with those who have not yet earned the privilege."
factionOwned_archetype_mage_2: "A faint ward lingers over the cover. This knowledge is not open to the uninitiated - rank has its privileges in matters of study."
factionOwned_archetype_mage_3: 'A neat label affixed to the spine reads: "Restricted Circulation. Rank required."'
factionOwned_archetype_mage_4: "You feel the pull of the pages, but the order guards its texts carefully. Rise through their ranks, and this knowledge may yet be yours."
factionOwned_archetype_mage_5: "The order does not distribute its texts freely. What is written here is reserved for those who have demonstrated sufficient standing."
factionOwned_archetype_mage_6: '"That text is not available to you," a robed figure says, without looking up from their own work. "Advance your standing with the order, and perhaps that will change."'
factionOwned_archetype_mage_7: 'A small placard rests beside the book: "Circulated to senior members only. Inquire within."'
factionOwned_archetype_mage_8: "The book is marked with the order's seal. You know what that means: until you are one of theirs in more than name, these pages will not open for you."

factionOwned_archetype_rogue_1: "This one isn't for you - not yet. Earn a little more trust with the outfit, and things like this have a way of becoming available."
factionOwned_archetype_rogue_2: "The guild keeps certain texts for members who have proven themselves. You haven't reached that point. Not yet."
factionOwned_archetype_rogue_3: 'A folded note is slipped under the cover: "Eyes for members only. You know who you are."'
factionOwned_archetype_rogue_4: "You know better than to touch what isn't offered to you. The guild notices these things, and you haven't earned this yet."
factionOwned_archetype_rogue_5: "Information like this has value precisely because it isn't shared freely. Climb a little higher, and the right people will see that you get a look."
factionOwned_archetype_rogue_6: '"Not for you, friend," someone murmurs nearby. "Come back when you''ve done more for the cause."'
factionOwned_archetype_rogue_7: "The guild keeps its knowledge close. Who gets to read what depends entirely on how much you've proven you can be trusted."
factionOwned_archetype_rogue_8: 'A scrawled note marks the cover: "Guild use. Keep it that way."'

